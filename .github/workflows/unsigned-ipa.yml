name: Unsigned iOS IPA

on:
  workflow_dispatch:
  # Push is included so a contents-only token can start this build.
  # workflow_dispatch remains the way to rebuild from the Actions tab.
  push:
    branches: [main]

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install JavaScript dependencies
        working-directory: app
        run: npm ci
      - name: Package unsigned IPA
        run: bash scripts/package-unsigned-ipa.sh
      - uses: actions/upload-artifact@v7
        with:
          name: BookShelf-unsigned-ipa
          path: dist/BookShelf-unsigned.ipa
          if-no-files-found: error
